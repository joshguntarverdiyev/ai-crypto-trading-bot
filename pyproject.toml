[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "aicryptotrader"
version = "0.0.0"
description = "AI-assisted crypto trading research system — Phase 0 foundation (no trading functionality)."
readme = "README.md"
requires-python = ">=3.12"
license = { text = "Proprietary" }

# Phase 0 runtime dependencies ONLY. Future-phase libraries (ccxt, anthropic,
# python-telegram-bot, fastapi, pandas/pandas-ta) are intentionally excluded
# until the phase that uses them.
dependencies = [
    "pydantic>=2,<3",
    "pydantic-settings>=2,<3",
    "SQLAlchemy>=2,<3",
]

[project.optional-dependencies]
dev = [
    "pytest>=8",
    "ruff>=0.6",
    "mypy>=1.11",
]

[tool.setuptools.packages.find]
include = ["app*"]

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]
addopts = "-q"

[tool.ruff]
target-version = "py312"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

[tool.mypy]
python_version = "3.12"
packages = ["app"]
warn_unused_ignores = true
ignore_missing_imports = true
