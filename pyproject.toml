[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "aicryptotrader"
version = "0.0.0"
description = "AI-assisted crypto trading research system — Phase 0 foundation (no trading functionality)."
readme = "README.md"
requires-python = ">=3.12"
license = { text = "Proprietary" }

# Core runtime dependencies (P0–P6). Deliberately minimal. Future-phase libraries
# (ccxt, anthropic, python-telegram-bot, pandas/numpy/scipy) remain excluded until
# the phase that uses them. Phase 7 statistics/metrics/Monte-Carlo are pure-Python
# (stdlib math/statistics/random) — no numpy/scipy/pandas.
dependencies = [
    "pydantic>=2,<3",
    "pydantic-settings>=2,<3",
    "SQLAlchemy>=2,<3",
]

[project.optional-dependencies]
dev = [
    "pytest>=8",
    "ruff>=0.6",
    "mypy>=1.11",
]
# Phase 7 dashboard (read-only + stop-only controls). Kept out of the base
# runtime so the core app import graph never requires FastAPI. httpx powers the
# in-process, offline Starlette TestClient used by the dashboard tests.
dashboard = [
    "fastapi>=0.115,<0.116",
    "uvicorn>=0.30,<0.36",
    "httpx>=0.27,<0.29",
]

[tool.setuptools.packages.find]
include = ["app*", "backtesting*", "dashboard*"]

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]
addopts = "-q"

[tool.ruff]
target-version = "py312"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

[tool.mypy]
python_version = "3.12"
packages = ["app"]
warn_unused_ignores = true
ignore_missing_imports = true
